<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>길드가 좋아</title><style>*{box-sizing:border-box}body{margin:0;background:#191e22;color:#e5e9e7;font:16px/1.9 system-ui,sans-serif}main{max-width:740px;margin:0 auto;padding:30px 25px 50px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #ffffff15;padding-bottom:20px;color:#99a4ab;font-size:14px}button{font:inherit;cursor:pointer;color:#c8ef91;background:transparent;border:1px solid #ffffff30;border-radius:6px;padding:6px 14px}article{padding:48px 0 30px;min-height:300px;overflow-wrap:anywhere}.chapter{font-size:11px;letter-spacing:3px;color:#c8ef91}h1{font-size:clamp(26px,5vw,38px);font-weight:500;line-height:1.5;margin:18px 0 28px}.content{white-space:pre-wrap;color:#b3bec4;line-height:2}img{max-width:100%;display:block;margin:25px 0;border-radius:7px}audio{width:100%;display:block;margin:25px 0}.row{display:flex;border:1px solid #647850;border-radius:7px;background:#262d30}input{flex:1;min-width:0;background:none;border:0;color:white;padding:16px;font:inherit}input:focus-visible,button:focus-visible{outline:2px solid #c8ef91}.row button{border:0;font-size:23px;padding:6px 20px}#feedback{font-size:14px;color:#96a4ad;min-height:28px}footer{margin-top:50px;font-size:10px;letter-spacing:3px;color:#64717a;text-align:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.inline-media{display:block;white-space:normal;margin:16px 0}.hint-area{padding:10px 27px}.hint-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.8;color:var(--game-muted)}.game-theme{color:var(--game-text)}.game-theme .story-text,.game-theme .content,.game-theme .game-top span,.game-theme header,.game-theme footer,.game-theme .game-bottom,.game-theme #feedback,.game-theme .answer-form p{color:var(--game-muted)}.game-theme .scene-label,.game-theme .chapter,.game-theme button{color:var(--game-accent)}.game-theme .game-top,.game-theme header,.game-theme button{border-color:var(--game-border)}.game-theme .answer-row,.game-theme .row{background:var(--game-input);border-color:var(--game-border)}.game-theme .answer-row input,.game-theme input{color:var(--game-text)!important}.game-theme input::placeholder{color:var(--game-muted);opacity:.8}.rich-editor{color:var(--game-muted,#aab4bc)}</style></head><body class="game-theme"><main><header><span id="game-title"></span><button id="restart">처음으로</button></header><article id="story"></article><form id="answer-form"><label for="answer" class="sr">정답 입력</label><div class="row"><input id="answer" autocomplete="off"><button aria-label="정답 제출">↵</button></div><p id="feedback" role="status"></p></form><div id="game-hint" class="hint-area"></div><footer id="game-credit"></footer></main><script>function backgroundColor(page){return typeof page.background==='string'&&/^#[0-9a-f]{6}$/i.test(page.background)?page.background:'#20252a'}
function applyGameTheme(element,page){
  const color=backgroundColor(page),rgb=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16)/255).map(v=>v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  const light=0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2]>0.179;
  element.style.backgroundColor=color;
  element.style.setProperty('--game-text',light?'#182026':'#f3f5f4');
  element.style.setProperty('--game-muted',light?'#273139':'#d3dce2');
  element.style.setProperty('--game-accent',light?'#24351b':'#e4ffd1');
  element.style.setProperty('--game-border',light?'#18202655':'#ffffff55');
  element.style.setProperty('--game-input',light?'#ffffffb3':'#00000055');
}
function cleanRuns(runs) {
  if (!Array.isArray(runs) || runs.length > 100000) throw Error('글자 서식 정보가 올바르지 않습니다.');
  return runs.map(run => {
    if (run && typeof run.mediaId === 'string') return {mediaId:run.mediaId};
    if (!run || typeof run.text !== 'string') throw Error('글자 서식 내용이 올바르지 않습니다.');
    const safe = {text: run.text};
    if (run.bold === true) safe.bold = true;
    if (run.italic === true) safe.italic = true;
    if (typeof run.color === 'string' && /^#[0-9a-f]{6}$/i.test(run.color)) safe.color = run.color;
    if ([12,16,20,24,32,40,48].includes(run.size)) safe.size = run.size;
    if (['sans-serif','serif','monospace'].includes(run.font)) safe.font = run.font;
    return safe;
  });
}
function renderRuns(element, page, editing = false) {
  element.replaceChildren();
  if (!page.runs) { element.textContent = page.content; return; }
  cleanRuns(page.runs).forEach(run => {
    if (run.mediaId) {
      const media = page.media.find(item=>item.id===run.mediaId);
      if (!media) return;
      const box = document.createElement('span');
      box.className='inline-media';
      box.setAttribute('data-media-id',media.id);
      if(editing) box.contentEditable='false';
      const asset=document.createElement(media.type.startsWith('image/')?'img':'audio');
      asset.src=media.data;
      if(asset.tagName==='IMG') asset.alt=media.name;
      else {asset.controls=true;asset.preload='metadata';asset.setAttribute('aria-label',media.name)}
      box.append(asset);element.append(box);return;
    }
    const span = document.createElement('span');
    span.textContent = run.text;
    if (run.bold) span.style.fontWeight = '700';
    if (run.italic) span.style.fontStyle = 'italic';
    if (run.color) span.style.color = run.color;
    if (run.size) span.style.fontSize = run.size / 16 + 'rem';
    if (run.font) span.style.fontFamily = run.font;
    element.append(span);
  });
}
function drawHint(root,page){root.replaceChildren();if(!page.hintEnabled)return;const button=document.createElement('button'),text=document.createElement('p');button.type='button';button.textContent='힌트 보기';button.setAttribute('aria-expanded','false');text.textContent=page.hint||'등록된 힌트가 없습니다.';text.hidden=true;text.className='hint-text';button.onclick=()=>{text.hidden=!text.hidden;button.textContent=text.hidden?'힌트 보기':'힌트 닫기';button.setAttribute('aria-expanded',String(!text.hidden))};root.append(button,text);}
(function gameRuntime(data){const norm=v=>v.normalize('NFC').trim().toLocaleLowerCase('en');let pageId=data.startId;const root=document.getElementById('story'),form=document.getElementById('answer-form'),input=document.getElementById('answer'),feedback=document.getElementById('feedback');function render(){const p=data.pages.find(p=>p.id===pageId);applyGameTheme(document.body,p);root.replaceChildren();const label=document.createElement('span');label.className='chapter';label.textContent=p.ending?'THE END':'INTERACTIVE STORY';const h=document.createElement('h1');h.textContent=p.title;const content=document.createElement('div');content.className='content';renderRuns(content,p);root.append(label,h,content);drawHint(document.getElementById('game-hint'),p);input.placeholder=p.placeholder||'정답을 입력하세요';feedback.textContent=p.ending?'엔딩에 도착했습니다. 다른 장소로도 이동할 수 있습니다.':'단서를 따라, 다음 장면으로.';document.title=p.title+' · '+data.title}form.onsubmit=e=>{e.preventDefault();const key=norm(input.value),next=data.pages.find(p=>key&&norm(p.answer)===key);if(!next){feedback.textContent='일치하는 정답이 없습니다. 단서를 다시 살펴보세요.';input.select();return}pageId=next.id;input.value='';render();window.scrollTo({top:0,behavior:'smooth'});input.focus()};document.getElementById('restart').onclick=()=>{pageId=data.startId;input.value='';render()};document.getElementById('game-title').textContent=data.title;document.getElementById('game-credit').textContent='A STORY MADE WITH '+(data.author||'IG Making Tool');render()})({"version":1,"id":"4bb80fb8-2b15-4c37-bd0f-6dc9b5076ed7","author":"뀨상","title":"길드가 좋아","startId":"start","pages":[{"id":"start","title":"운이 없는 사람","answer":"시작","hintEnabled":true,"hint":"전화패드는 이것과 반대입니다.","background":"#20252a","content":"이 이야기는 실내화를 바탕으로 제작된 이야기입니다.\n허구의 사건이며 실제 사건이나 인물과 관련 없다능.\n이런거 써놔야 좀 멋있어 보일까봐 써봤습니다.\n\n.\n.\n.\n.\n.\n.\n.\n.\n.\n“아, 또 나만 운 없어!”\n\n또 장기백이었다.\n\n한동안 모니터를 노려봤다. 100%라고 씌어진 숫자를 말이다.\n그 자리를 보고 있으면 쏟아부은 재료라도 돌아올 것 같았다.\n\n물론 아무 일도 일어나지 않았다.\n\n왜 항상 나만 이럴까.\n\n누구나 운이 나쁜 날은 있다. 두 번, 세 번 연속으로 실패할 수도 있다. 나도 그 정도는 안다. 그런데 불운에도 적당한 선이라는 게 있어야 하지 않나.\n\n남들은 장인의 기운이 40~50%만 쌓여도 망했다며 투덜댔다. 나는 90%에 성공하면 안도했다. 그래도 장기백까지는 안 갔다고. 이번에는 그나마 운이 좋았다고.\n\n언제부터였을까. 남들이 억울해하는 결과를, 나는 다행이라고 여기게 된 게.\n\n처음에는 화가 났고, 그다음에는 허탈했다. 이제는 강화 버튼을 누르기도 전에 실패할 장면부터 떠올랐다. 기대하지 않으면 덜 실망할 줄 알았는데, 막상 실패하고 나면 속이 쓰린 건 똑같았다.\n\n“…확률 조작인 것 같은데, 이거.”\n\n혼잣말을 뱉고는 헛웃음을 흘렸다.\n\n내가 생각해도 우스운 소리였다. 게임사가 뭐 하러 나 하나를 콕 집어 확률을 건드리겠는가. 내가 대단한 사람도 아니고, 그래 봐야 퇴근 후 게임에 접속하는 수많은 유저 중 하나일 뿐인데.\n\n알고 있었다. 그냥 운이 없었던 거라고. 확률이라는 건 원래 그런 거라고.\n\n그렇게 생각하면 설명은 됐다.\n납득이 되지 않을 뿐이었다.\n\n하지만 얼마 지나지 않아, 나는 알게 됐다.\n\n\n\n\n\n\n홧김에 내뱉은 그 허무맹랑한 의심이\n사실이었다는 것을\n\n\n세상은 나를 중심으로 돌아가고 있었다.\n세상은.... 나를 지켜보고 있었다.\n\n.\n.\n.\n.\n.\n.\n.\n\n“…확률 조작인 것 같은데, 이거.”\n\n혼잣말과 함께 헛웃음 짓고 있을 때였다\n\n\n띠리리리리리리리-♬\n띠리리리리리리리-♬\n\n\n“어우, 깜짝이야.”\n\n어깨가 움찔하며 마우스를 쥔 손이 미끄러졌다. 커서가 화면 구석으로 튀었다.\n\n디스코드 통화 요청이었다.\n\n소리가 유난히 컸던 건 아니었다. 개인 통화가 걸려 온 적이 없어서, 이런 알림음이 난다는 것조차 몰랐을 뿐이다. 늘 드나들던 음성 채널과는 달리, 화면에는 나 혼자 받기를 기다리는 통화 창이 떠 있었다.\n\n\"...누구지?\"\n\n무심코 수락 버튼 쪽으로 가져가던 손을 멈췄다.\n프로필 아이콘. 그리고 그 옆의 아이디.\n\n낯이 익었다.\n\n분명 본 적이 있었다. 어디서 봤는지는 떠오르지 않는데, 처음 보는 사람은 아니라는 느낌만 선명했다.\n나는 화면 쪽으로 조금 몸을 기울였다.\n\n알림음이 다시 울렸다.\n\n손가락을 마우스 위에 얹은 채, 아이디를 천천히 되읽었다.\n누구였더라.\n\n\n문제==========================\n7→9↓3\n8↓2\n7→9↓5←1→3\n7→9↓3←1↑\n8↓2↑6\n=============================","runs":[{"text":"이 이야기는 실내화를 바탕으로 제작된 이야기입니다.","bold":true,"color":"#f79797","size":12,"font":"monospace"},{"text":"\n","color":"#f79797","size":12,"font":"monospace"},{"text":"허구의 사건이며 실제 사건이나 인물과 관련 없다능.","bold":true,"color":"#f79797","size":12,"font":"monospace"},{"text":"\n"},{"text":"이런거 써놔야 좀 멋있어 보일까봐 써봤습니다.","bold":true,"color":"#f79797","size":12,"font":"monospace"},{"text":"\n","bold":true,"color":"#f79797","size":12},{"text":"\n"},{"text":".","size":16},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":".\n"},{ 률 조작인 것 같은데, 이거.”","color":"#a093c2"},{"text":"\n"},{"text":"\n"},{"text":"혼잣말과 함께 헛웃음 짓고 있을 때였다"},{"text":"\n"},{"text":"\n"},{"text":"\n"},{"text":"띠리리리리리리리-♬","color":"#d13333","size":20},{"text":"\n"},{"text":"띠리리리리리리리-♬","color":"#d13333","size":20},{"text":"\n"},{"text":"\n"},{"text":"\n"},{"text":"“어우, 깜짝이야.”","color":"#a093c2"},{"text":"\n"},{"text":"\n"},{"text":"어깨가 움찔하며 마우스를 쥔 손이 미끄러졌다. 커서가 화면 구석으로 튀었다."},{"text":"\n"},{"text":"\n"},{"text":"디스코드 통화 요청이었다."},{"text":"\n"},{"text":"\n"},{"text":"소리가 유난히 컸던 건 아니었다. 개인 통화가 걸려 온 적이 없어서, 이런 알림음이 난다는 것조차 몰랐을 뿐이다. 늘 드나들던 음성 채널과는 달리, 화면에는 나 혼자 받기를 기다리는 통화 창이 떠 있었다."},{"text":"\n"},{"text":"\n"},{"text":"\"...누구지?\"","color":"#a093c2"},{"text":"\n"},{"text":"\n"},{"text":"무심코 수락 버튼 쪽으로 가져가던 손을 멈췄다."},{"text":"\n"},{"text":"프로필 아이콘. 그리고 그 옆의 아이디.","size":16},{"text":"\n"},{"text":"\n"},{"text":"낯이 익었다."},{"text":"\n"},{"text":"\n","size":16},{"text":"분명 본 적이 있었다. 어디서 봤는지는 떠오르지 않는데, 처음 보는 사람은 아니라는 느낌만 선명했다.","size":16},{"text":"\n"},{"text":"나는 화면 쪽으로 조금 몸을 기울였다.","size":16},{"text":"\n"},{"text":"\n"},{"text":"알림음이 다시 울렸다.","size":16},{"text":"\n"},{"text":"\n"},{"text":"손가락을 마우스 위에 얹은 채, 아이디를 천천히 되읽었다."},{"text":"\n"},{"text":"누구였더라.","size":16},{"text":"\n"},{"text":"\n"},{"text":"\n"},{"text":"문제==========================\n"},{"text":"7→9↓3","bold":true},{"text":"\n"},{"text":"8↓2","bold":true},{"text":"\n"},{"text":"7→9↓5←1→3","bold":true},{"text":"\n"},{"text":"7→9↓3←1↑","bold":true},{"text":"\n"},{"text":"8↓2↑6","bold":true},{"text":"\n"},{"text":"=============================","bold":true}],"placeholder":"전화를 건 사람은 누굴까요?","ending":false,"media":[]},{"id":"basement","title":"방랑자","answer":"길마","hintEnabled":true,"hint":"휴대폰을 기울여서 보자","background":"#20252a","content":"……아.\n\n떠올랐다.\n\n이 사람, 전 길드의 길드마스터다.\n\n길드명은 ‘가로수바다’.\n길드마스터의 닉네임은 ‘규술상사’.\n\n아이디가 떠오르자, 한동안 잊고 지냈던 길드 이름까지 자연스레 따라 나왔다.\n이 길드 저 길드를 떠돌던 내가 그나마 일 년 정도 머물렀던 곳이었다.\n탈퇴 한지는 한 달 정도 되었나.\n\n\n그런데 이 사람이 갑자기 왜?\n\n통화 창의 프로필 아이콘을 바라봤다.\n익숙한 그림인데도, 이렇게 따로 연락이 오니 어쩐지 낯설다.\n\n.\n.\n.\n.\n.\n.\n\n나는 로아를 시작한 뒤로 수십 개의 길드에 가입하고 탈퇴했다.\n처음 들어갈 때마다 이번에는 좀 오래 지내보자고 생각했지만, 그 다짐이 무색하게 내 닉네임 위의 길드 이름은 자주 바뀌었다.\n\n어떤 곳에서는 얼마 못 가 강퇴당했고,\n어떤 곳에서는 내가 먼저 나왔다.\n\n남들은 길드원들과 친해지고 편하게 지낼동안,\n나는 가입 문의가 더 익숙해졌다.\n\n물론 이유는 있었다.\n내가 유독 한곳에 오래 머물지 못했던 이유는…\n\n\n\n\n\n\n\n\n띠리리리리—♬\n띠리리리리—♬\n\n\n\n아, 맞다. 디스코드.\n생각에 잠긴 사이에도 통화 요청음은 계속 울리고 있었다.\n\n오래 받지 않아서일까.\n요청음에 짜증이 섞인듯이 들린다.\n\n아직 끊지는 않았네.\n\n\n일단…… \n나는……\n\n\n\n문제===========\n\n","runs":[{"text":"……아."},{"text":"\n"},{"text":"\n"},{"text":"떠올랐다."},{"text":"\n"},{"text":"\n"},{"text":"이 사람, 전 길드의 "},{"text":"길드마스터","bold":true,"color":"#caf193"},{"text":"다."},{"text":"\n"},{"text":"\n"},{"text":"길드명은"},{"text":" ‘","color":"#9adad6"},{"text":"가로수바다","bold":true,"color":"#9adad6"},{"text":"’.","color":"#9adad6"},{"text":"\n"},{"text":"길드마스터의 닉네임은 "},{"text":"‘","color":"#9adad6"},{"text":"규술상사","bold":true,"color":"#9adad6"},{"text":"’.","color":"#9adad6"},{"text":"\n"},{"text":"\n"},{"text":"아이디가 떠오르자, 한동안 잊고 지냈던 길드 이름까지 자연스레 따라 나왔다."},{"text":"\n"},{"text":"이 길드 저 길드를 떠돌던 내가 그나마 일 년 정도 머물렀던 곳이었다."},{"text":"\n"},{"text":"탈퇴 한지는 한 달 정도 되었나."},{"text":"\n"},{"text":"\n"},{"text":"\n"},{"text":"그런데 이 사람이 갑자기 왜?"},{"text":"\n"},{"text":"\n"},{"text":"통화 창의 프로필 아이콘을 바라봤다."},{"text":"\n"},{"text":"익숙한 그림인데도, 이렇게 따로 연락이 오니 어쩐지 낯설다."},{"text":"\n"},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"."},{"text":"\n"},{"text":"\n"},{"text":"나는 로아를 시작한 뒤로 수십 개의 길드에 가입하고 탈퇴했다."},{"text":"\n"},{"text":"처음 들어갈 때마다 이번에는 좀 오래 지내보자고 생각했지만, 그 다짐이 무색하게 내 닉네임 위의 길드 이름은 자주 바뀌었다."},{"text":"\n"},{"text":"\n"},{"text":"어떤 곳에서는 얼마 못 가 강퇴당했고,"},{"text":"\n"},{"text":"어떤 곳에서는 내가 먼저 나왔다."},{"text":"\n"},{"text":"\n"},{"text":"남들은 길드원들과 친해지고 편하게 지낼동안,"},{"text":"\n"},{"text":"나는 가입 문의가 더 익숙해졌다."},{"text":"\n"},{"text":"\n"},{"text":"물론 이유는 있었다."},{"text":"\n"},{"text":"내가 유독 한곳에 오래 머물지 못했던 이유는…"},{"text":"\n"}, 이 지내고 있냐고요.」\n잘못 들은 게 아니었다.\n\n화면의 아이디를 다시 확인했다.\n규술상사\n조금 전까지 보고 있던 이름 그대로였다.\n\n내가 알던 그는 적어도 누군가에게 대놓고 욕을 퍼붓는 사람이 아니었다.\n그런 사람이 지금, 안부를 묻던 말투 그대로 나를 욕하고 있었다.\n\n“당신 누구세요? 규술상사 님 맞으세요?”\n「네. 저예요. 너무 반갑죠?」\n목소리는 틀림없었다. 거의 일 년을 같은 길드에서 지내며 수도 없이 들었던 목소리였다.\n문장을 말하며 뱉는 억양도, 말투도 같았다.\n\n「아, 참.」\n본론이 떠오른 듯 그가 입을 뗐다.\n\n「○○, 잘 지내요?」\n그 얘기를 듣자 숨이 턱 막혔다.\n\n\n\n\n문제===============================\nVanguard Pen Society = 펜\nCommunity Of Traditional Horticulture = 채소\nGlobal Urban Development = ?\n===================================","runs":[{"text":"한참을 머뭇거리다 결국 통화 버튼을 눌렀다.","color":"#fafafa"},{"text":"\n"},{"text":".","color":"#fafafa"},{"text":"\n"},{"text":".","color":"#fafafa"},{"text":"\n"},{"text":".\n","color":"#fafafa"},{"text":"「여보세요? 들리세요?」","color":"#6f9b7c"},{"text":"\n"},{"text":"익숙한 목소리가 헤드셋으로 들려왔다.","color":"#fafafa","size":16},{"text":"\n"},{"text":"\n","color":"#fafafa"},{"text":"“네, 들립니다. 안녕하세요.”","color":"#9399c2"},{"text":"\n"},{"text":"인사를 하고 나니 오히려 어색해졌다. 뒤에 무슨 말을 붙여야 할지 몰라 입을 다물었다.","color":"#fafafa"},{"text":"\n"},{"text":"\n","color":"#fafafa"},{"text":"「반가워요. 오랜만이네요. 잘 지내죠?」","color":"#6f9b7c"},{"text":"\n"},{"text":"그쪽도 나와 별반 다르지 않은 모양이었다. 반가운 사람을 만났다기보다는, 오랜만에 연락한 상대에게 건넬 만한 말을 차례로 꺼내는 느낌이었다.","color":"#fafafa","size":16},{"text":"\n"},{"text":"\n","color":"#fafafa"},{"text":"“네, 잘 지냅니다. 제가 탈퇴한 지 꽤 된 것 같은데…… 무슨 일이세요?”","color":"#9399c2"},{"text":"\n"},{"text":"길드에 있을 때도 대화는 자주 나눴다. 그렇다고 안부를 물을 만큼 가까운 사이는 아니었다.","color":"#fafafa","size":16},{"text":"\n"},{"text":"서로의 근황을 주고받는 이 시간이 불편했다. 용건이 있다면 바로 말해줬으면 했다.","color":"#fafafa","size":16},{"text":"\n"},{"text":"\n","color":"#fafafa"},{"text":"「하하…… 그게, 다름이 아니고…….」","color":"#6f9b7c"},{"text":"\n"},{"text":"그가 멋쩍은 웃음을 흘렸다.","color":"#fafafa","size":16},{"text":"\n"},{"text":"무언가 부탁하려는 걸까. 아니면 길드에 있을 때 미처 정리하지 못한 일이 있었나.","color":"#fafafa","size":16},{"text":"\n"},{"text":"\n","color":"#fafafa"},{"text":"나는 마우스에서 손을 떼고 의자 등받이에 몸을 기댔다. 머뭇거리는 말끝에 어떤 용건이 따라올지 기다렸다.","color":"#fafafa"},{"text":"\n"},{"te text":"그 얘기를 듣자 숨이 턱 막혔다.","color":"#fafafa","size":16},{"text":"\n","color":"#fafafa","size":16},{"text":"\n"},{"text":"\n"},{"text":"\n"},{"text":"\n"},{"text":"문제===============================","color":"#fafafa","size":16},{"text":"\n"},{"text":"Vanguard Pen Society = 펜","color":"#fafafa"},{"text":"\n"},{"text":"Community Of Traditional Horticulture = 채소","color":"#fafafa"},{"text":"\n"},{"text":"Global Urban Development = ?"},{"text":"\n"},{"text":"==================================="}],"placeholder":"○○은 누구일까? (정답 두 글자 아닐 수도 있음)","ending":false,"media":[]},{"id":"6f04645d-c325-495f-a22d-8edec4dc41cb","title":"예의있는 무례함","answer":"형","content":"「형은, 잘 지내요?」\n\n“뭐? 너 미쳤어? 네가 형을 어떻게…… 너…….”\n말이 이어지지 않았다. 묻고 싶은 건 분명한데 혀가 제대로 움직이지 않았다. 책상 위에 올린 손끝에 힘이 들어갔다.\n\n그는 재촉하지 않았다.\n내가 더듬는 말을 듣고 있었다.\n\n「잘 못 지내잖아요.」\n잠깐의 침묵 뒤에 그가 덧붙였다.\n\n「왜 아니라고 대답을 안 해요?」\n“야, 이 개…….”\n\n「어?」\n그가 짧게 말을 끊었다.\n\n「저한테 욕하면 안 될 텐데?」\n너무도 태연한 목소리였다. 오히려 내가 실수라도 한 것처럼 가볍게 타이르는 말투에, 참았던 고함이 터져 나왔다.\n\n“무슨 개소리냐고!”\n소리를 지른 뒤에도 숨이 가빴다. 마이크 바로 앞에서 내 거친 숨소리만 오갔다.\n그러다 웃음소리가 들렸다.\n\n「크크크……오늘은 리액션 좋네요?」\n오늘은. 그 말에 다음 욕설이 목 안에서 멎었다.\n\n「다음에 다시 연락해요. 길게는 통화하기 힘들어서.」\n“잠깐, 너…….”\n\n뚝.\n\n\n\n통화가 끊겼다.\n\n나는 입을 벌린 채 화면을 바라봤다.\n조금 전까지 그가 있던 자리에 통화가 종료됐다는 표시만 남아 있었다.\n\n물어야 할 말은 하나도 묻지 못했다.\n대체 왜 연락을 했는지.\n형을 어떻게 아는지.\n\n그리고…….\n형이 그런 상태인걸 어떻게 아는지.\n\n\n나는…….\n\n\n문제=================\nK, DC RF QA\nQHT46 = ?\n====================","placeholder":"나는 지금…….","ending":false,"media":[],"runs":[{"text":"「형은, 잘 지내요?」","color":"#6f9b7c"},{"text":"\n"},{"text":"\n"},{"text":"“뭐? 너 미쳤어? 네가 형을 어떻게…… 너…….”","color":"#9399c2"},{"text":"\n"},{"text":"말이 이어지지 않았다. 묻고 싶은 건 분명한데 혀가 제대로 움직이지 않았다. 책상 위에 올린 손끝에 힘이 들어갔다."},{"text":"\n"},{"text":"\n"},{"text":"그는 재촉하지 않았다."},{"text":"\n"},{"text":"내가 더듬는 말을 듣고 있었다."},{"text":"\n"},{"text":"\n"},{"text":"「잘 못 지내잖아요.」","color":"#6f9b7c"},{"text":"\n"},{"text":"잠깐의 침묵 뒤에 그가 덧붙였다."},{"text":"\n"},{"text":"\n"},{"text":"「왜 아니라고 대답을 안 해요?」","color":"#6f9b7c"},{"text":"\n"},{"text":"“야, 이 개
